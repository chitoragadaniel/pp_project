name:                stone
version:             0.1.0.0
license:             MIT
author:              "Daniel Chitoraga, Stef Waalders"
maintainer:          "d.chitoraga@student.utwente.nl, s.waalders@student.utwente.nl"
copyright:           "2024 Daniel Chitoraga, Stef Waalders"

extra-source-files:
- README.md

description:         Implementation of Stone, an unnecessary language.

dependencies:
- base >= 4.7 && < 5
- parsec >= 3.1 && < 3.2
- sprockell >= 2022.0
- hspec >= 2.8 && < 2.9
- QuickCheck >= 2.14 && < 2.15
- silently

library:
  source-dirs: src

executables:
  my-lang-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - stone

tests:
  my-lang-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - stone
